<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1210">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vico · Dashboard</title>
<link rel="manifest" href="../titolare/manifest.webmanifest">
<link rel="icon" href="../assets/img/icona-titolare-192.png">
<link rel="apple-touch-icon" href="../assets/img/icona-titolare-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/desktop.css">
</head>
<body>

<div class="demo-bar" id="demo-bar" hidden>DEMO · dati finti per provare · PIN 1234</div>

<!-- accesso -->
<section id="login" class="accesso" hidden>
  <img class="logo" src="../assets/img/logo.jpg" alt="">
  <h1>Vico · Dashboard</h1>
  <p class="muted">Statistiche e storico · solo per il titolare</p>
  <form id="f-login" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN del titolare" aria-label="PIN del titolare">
    <label class="spunta"><input type="checkbox" id="ricorda"> Ricorda su questo computer</label>
    <button class="btn oro" type="submit">Entra</button>
    <p class="errore" id="login-errore" role="alert"></p>
  </form>
</section>

<!-- dashboard -->
<div id="app" hidden>
  <header class="testa">
    <div class="marchio"><img src="../assets/img/logo.jpg" alt=""><div><b>Vico del Carmine</b><span>Dashboard</span></div></div>
    <nav class="periodi" id="periodi" aria-label="Periodo">
      <button data-p="ieri">Ieri</button>
      <button data-p="7">7 giorni</button>
      <button data-p="30">30 giorni</button>
      <button data-p="90">90 giorni</button>
      <button data-p="mese">Questo mese</button>
      <button data-p="mesePrec">Mese scorso</button>
      <button data-p="anno">Quest'anno</button>
    </nav>
    <div class="date">
      <input type="date" id="dal" aria-label="Dal"><span>→</span><input type="date" id="al" aria-label="Al">
      <select id="periodi-salvati" aria-label="Periodi salvati"><option value="">Periodi salvati…</option></select>
      <select id="confronto" aria-label="Con cosa confrontare le percentuali">
        <option value="prec">% sul periodo prima</option>
        <option value="sett">% sulle stesse settimane prima</option>
        <option value="">niente %</option>
      </select>
    </div>
    <div class="azioni">
      <a class="btn vuoto" id="b-cruscotto" href="../titolare/" title="Torna alla dashboard di tutti i giorni">📱 Cruscotto</a>
      <button class="btn vuoto" id="b-esporta" title="Scarica i numeri giorno per giorno (Excel)">⬇︎ Esporta</button>
      <button class="btn vuoto" id="b-aggiorna" title="Aggiorna">↻</button>
      <button class="btn vuoto" id="b-esci" title="Esci da questo computer (anche dal cruscotto)">Esci</button>
    </div>
  </header>

  <p class="riga-periodo" id="riga-periodo"></p>
  <div id="avvisi"></div>

  <section class="kpi" id="kpi"></section>

  <section class="card grande">
    <div class="card-testa">
      <h2>Andamento</h2>
      <select id="metrica" aria-label="Cosa mostrare">
        <option value="incasso">Incasso (€)</option>
        <option value="coperti">Coperti (cassa)</option>
        <option value="persone">Persone prenotate</option>
        <option value="pren">Prenotazioni</option>
        <option value="aspEuro">Asporto (€)</option>
        <option value="club">Nuovi nel Club</option>
        <option value="tavoli">Tavoli portati dagli agenti</option>
        <option value="visite">Visite al sito</option>
      </select>
    </div>
    <div class="grafico alto"><canvas id="g-andamento"></canvas></div>
  </section>

  <div class="barra-riquadri">
    <h2>Riquadri</h2>
    <label class="spunta"><input type="checkbox" id="piu-usati"> Metti prima i più aperti</label>
  </div>
  <section class="riquadri" id="riquadri"></section>

  <!-- dettaglio di un riquadro -->
  <section class="dettaglio" id="dettaglio" hidden>
    <div class="dettaglio-testa">
      <button class="btn vuoto" id="b-indietro">← Tutti i riquadri</button>
      <h2 id="dettaglio-titolo"></h2>
    </div>
    <div id="dettaglio-corpo"></div>
  </section>
</div>

<!-- finestra (scheda cliente, chiave del gestionale…) -->
<div class="velo" id="velo" hidden>
  <div class="finestra" role="dialog" aria-modal="true">
    <button class="chiudi" id="b-chiudi" aria-label="Chiudi">✕</button>
    <div id="finestra-corpo"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../assets/js/desktop-dati.js"></script>
<script src="../assets/js/desktop.js"></script>
</body>
</html>
